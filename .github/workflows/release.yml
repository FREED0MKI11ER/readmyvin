name: Build & publish

# Builds the Linux server bundle and publishes a release tagged with the
# version from the VERSION file (e.g. v1.2.1). The server polls the latest
# release every 10 minutes via readmyvin-update.timer.
#
# To release: bump VERSION, commit, push.
#
# Triggers: push to main, or manual run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Read VERSION
        id: ver
        run: |
          set -euo pipefail
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          [ -n "$APP_VERSION" ] || { echo "VERSION file is empty"; exit 1; }
          echo "app=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$APP_VERSION"

      - name: Stamp version into frontend assets
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.app }}"
          S="${{ steps.ver.outputs.short }}"
          sed -i "s/const VERSION = '[^']*'/const VERSION = '$V'/" index.html
          sed -i "s/const CACHE_NAME = '[^']*'/const CACHE_NAME = 'vin-decoder-$V-$S'/" sw.js

      - name: Build server binary (linux/amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${{ steps.ver.outputs.app }}" \
            -o dist/counter counter.go

      - name: Package bundle
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.app }}"
          ASSETS="index.html dtc.html scanner.js scanner.css sw.js manifest.json robots.txt sitemap.xml og-image.svg icon-180x180.png icon-192x192.png icon-512x512.png maintenance-data-v3.json"
          mkdir -p pkg/updater
          cp dist/counter pkg/counter
          printf '%s\n' "$VERSION" > pkg/VERSION
          for f in $ASSETS; do cp "$f" "pkg/$f"; done
          printf '%s\n' $ASSETS > pkg/FILES
          # ship the updater so it can self-update
          for u in readmyvin-update.sh readmyvin-update.service readmyvin-update.timer; do
            cp "deploy/$u" "pkg/updater/$u"
          done
          tar -C pkg -czf dist/vindecoder-linux-amd64.tar.gz .
          ( cd dist && sha256sum vindecoder-linux-amd64.tar.gz > SHA256SUMS.txt )
          echo "---- checksums ----"
          cat dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.app }}
          name: v${{ steps.ver.outputs.app }}
          body: |
            **v${{ steps.ver.outputs.app }}** (commit `${{ steps.ver.outputs.short }}`)

            The server picks this up automatically on its next 10-minute check.
          make_latest: true
          files: |
            dist/vindecoder-linux-amd64.tar.gz
            dist/SHA256SUMS.txt
