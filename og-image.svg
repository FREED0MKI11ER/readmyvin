<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c0f"/>
      <stop offset="100%" style="stop-color:#1a1e26"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#252a35" stroke-width="1" opacity="0.3"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Glow accent -->
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="#a855f7" opacity="0.08"/>
  <ellipse cx="900" cy="450" rx="350" ry="250" fill="#3b82f6" opacity="0.05"/>
  
  <!-- VIN Badge -->
  <rect x="380" y="120" width="440" height="70" rx="12" fill="#12151a" stroke="#252a35" stroke-width="2"/>
  <text x="600" y="168" font-family="monospace" font-size="28" font-weight="bold" fill="#a855f7" text-anchor="middle">VIN DECODER</text>
  
  <!-- Main text -->
  <text x="600" y="340" font-family="sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">Free Vehicle</text>
  <text x="600" y="430" font-family="sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">History Lookup</text>
  
  <!-- Subtitle -->
  <text x="600" y="490" font-family="monospace" font-size="22" fill="#8b95a5" text-anchor="middle">Decode VINs • Check Recalls • View Safety Ratings</text>
  
  <!-- Domain -->
  <text x="600" y="580" font-family="monospace" font-size="20" fill="#5a6577" text-anchor="middle">readmyvin.com</text>
  
  <!-- Decorative VIN characters -->
  <g font-family="monospace" font-size="36" font-weight="bold" fill="#252a35">
    <text x="100" y="300">1</text>
    <text x="160" y="280">G</text>
    <text x="220" y="320">1</text>
    <text x="980" y="350">5</text>
    <text x="1040" y="380">7</text>
    <text x="1100" y="320">3</text>
  </g>
</svg>
